<!DOCTYPE html>
<html>
	<head>
		<title>Fancify Shamcify</title>		
		
		<link rel="stylesheet" href="/styles.css">	
	</head>

	<body>

		<div id="nav-placeholder"></div>

		<div class="container">
			<h1>Fancify</h1>
			<main>
				<div class="text-section">
					<label for="main-text">Text</label>
					<textarea name="input" id="textInput" rows="4" cols="30"></textarea>
				</div>

				<fieldset>
					<legend>Fancify Controls</legend>

					<button onclick="makeBigger()">Bigger!</button>
					<button onclick="moo()">MOO</button>

					<div class="radio-group">

						<input type="radio" name="fontStyle" id="fancy" onclick="styleText()"> 
						<label for="fancy">FancyShmancy</label>

						<input type="radio" name="fontStyle" id="boring" onchange="styleText()" checked>
						<label for="boring">BoringBetty</label>
					</div>
				</fieldset>
				
			</main>
		</div>		
		
		<!-- link to your script file here -->
		 <script src="fancifymytext.js"></script>  
		<script>
			fetch('/navbar.html')
			.then(res => res.text())
			.then(data => {
			document.getElementById('nav-placeholder').innerHTML = data;
			});
		</script>	
	</body>
</html>
